services:
  mysql:
    image: mysql:8
    container_name: bokji-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bokji
      MYSQL_USER: bokji
      MYSQL_PASSWORD: bokji11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - bokji-mysql-data:/var/lib/mysql
      # 빈 볼륨으로 처음 뜰 때 스키마·시드·갱신 SQL을 순서대로 자동 적재 (docker/initdb/01-load-data.sh)
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./src/main/resources/sql:/sql:ro

volumes:
  bokji-mysql-data:
